<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Linux-only render aid (used by convert.py / validate_layout.py).
     Windows ships 標楷體 as DFKai-SB, macOS as BiauKai. Linux has neither, so map
     them to AR PL UKai TW (apt: fonts-arphic-ukai), a Kai font with the same
     full-width CJK metrics, so previews keep the real line breaks and page count. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test name="family" qual="any"><string>標楷體</string></test>
    <edit name="family" mode="assign" binding="strong"><string>AR PL UKai TW</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>DFKai-SB</string></test>
    <edit name="family" mode="assign" binding="strong"><string>AR PL UKai TW</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>BiauKai</string></test>
    <edit name="family" mode="assign" binding="strong"><string>AR PL UKai TW</string></edit>
  </match>
</fontconfig>
