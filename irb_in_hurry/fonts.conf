<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Linux-only render aid (used by convert.py / validate_layout.py).
     Windows/macOS ship the fonts Taiwanese forms use; Linux has none of them, and
     fontconfig's default fallback for CJK is Noto … CJK JP, i.e. Japanese glyph
     shapes for many hanzi. Map each family to a Traditional Chinese face with the
     same full-width metrics, so previews keep the real line breaks, page count and
     Taiwan-standard glyphs:
       標楷體 / DFKai-SB / BiauKai                → AR PL UKai TW   (fonts-arphic-ukai)
       新細明體 / 細明體 / PMingLiU / MingLiU / 明朝 → AR PL UMing TW  (fonts-arphic-uming)
       微軟正黑體 / Microsoft JhengHei / CJK JP    → Noto Sans/Serif CJK TC (fonts-noto-cjk) -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- Every lookup is for Traditional Chinese text: makes the zh-tw face win
       the CJK fallback instead of the JP one. -->
  <match target="pattern">
    <edit name="lang" mode="assign" binding="strong"><string>zh-tw</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>標楷體</string></test>
    <edit name="family" mode="assign" binding="strong"><string>AR PL UKai TW</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>DFKai-SB</string></test>
    <edit name="family" mode="assign" binding="strong"><string>AR PL UKai TW</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>BiauKai</string></test>
    <edit name="family" mode="assign" binding="strong"><string>AR PL UKai TW</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>新細明體</string></test>
    <edit name="family" mode="assign" binding="strong"><string>AR PL UMing TW</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>PMingLiU</string></test>
    <edit name="family" mode="assign" binding="strong"><string>AR PL UMing TW</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>細明體</string></test>
    <edit name="family" mode="assign" binding="strong"><string>AR PL UMing TW</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>MingLiU</string></test>
    <edit name="family" mode="assign" binding="strong"><string>AR PL UMing TW</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>MS Mincho</string></test>
    <edit name="family" mode="assign" binding="strong"><string>AR PL UMing TW</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>ＭＳ 明朝</string></test>
    <edit name="family" mode="assign" binding="strong"><string>AR PL UMing TW</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>微軟正黑體</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Microsoft JhengHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Noto Sans CJK JP</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Noto Serif CJK JP</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK TC</string></edit>
  </match>
</fontconfig>
