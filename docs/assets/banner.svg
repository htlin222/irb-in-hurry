<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">IRB-in-Hurry</title>
  <desc id="d">IRB-in-Hurry banner: a stack of IRB forms flying out of a stopwatch. 43 KFSYSCC IRB forms, one command.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- Speed lines -->
  <g stroke="#facc15" stroke-linecap="round" opacity="0.55">
    <line x1="690" y1="120" x2="770" y2="120" stroke-width="4"/>
    <line x1="660" y1="170" x2="760" y2="170" stroke-width="3"/>
    <line x1="700" y1="290" x2="780" y2="290" stroke-width="4"/>
    <line x1="670" y1="240" x2="750" y2="240" stroke-width="2"/>
  </g>

  <!-- Flying forms -->
  <g filter="url(#shadow)">
    <g transform="translate(1010 60) rotate(14)">
      <rect width="150" height="196" rx="8" fill="#e2e8f0"/>
      <rect x="16" y="18" width="80" height="10" rx="3" fill="#94a3b8"/>
      <rect x="16" y="44" width="118" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="16" y="60" width="100" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="16" y="76" width="110" height="6" rx="3" fill="#cbd5e1"/>
      <text x="16" y="178" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#64748b">SF037</text>
    </g>
    <g transform="translate(900 110) rotate(-8)">
      <rect width="160" height="210" rx="8" fill="#f1f5f9"/>
      <rect x="16" y="18" width="90" height="10" rx="3" fill="#94a3b8"/>
      <g font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a">
        <rect x="16" y="46" width="16" height="16" rx="2" fill="#0f172a"/>
        <rect x="42" y="50" width="96" height="8" rx="3" fill="#cbd5e1"/>
        <rect x="16" y="74" width="16" height="16" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
        <rect x="42" y="78" width="80" height="8" rx="3" fill="#cbd5e1"/>
        <rect x="16" y="102" width="16" height="16" rx="2" fill="#0f172a"/>
        <rect x="42" y="106" width="104" height="8" rx="3" fill="#cbd5e1"/>
        <rect x="16" y="130" width="16" height="16" rx="2" fill="#0f172a"/>
        <rect x="42" y="134" width="70" height="8" rx="3" fill="#cbd5e1"/>
      </g>
      <text x="16" y="192" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#64748b">SF001</text>
    </g>
    <!-- Approved stamp sheet -->
    <g transform="translate(800 150) rotate(5)">
      <rect width="170" height="220" rx="8" fill="#ffffff"/>
      <rect x="18" y="20" width="96" height="10" rx="3" fill="#94a3b8"/>
      <rect x="18" y="46" width="134" height="6" rx="3" fill="#e2e8f0"/>
      <rect x="18" y="62" width="120" height="6" rx="3" fill="#e2e8f0"/>
      <rect x="18" y="78" width="128" height="6" rx="3" fill="#e2e8f0"/>
      <g transform="translate(85 150) rotate(-14)">
        <rect x="-68" y="-24" width="136" height="48" rx="6" fill="none" stroke="#16a34a" stroke-width="4"/>
        <text x="0" y="9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#16a34a" letter-spacing="2">READY</text>
      </g>
      <text x="18" y="204" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#64748b">SF094</text>
    </g>
  </g>

  <!-- Stopwatch -->
  <g transform="translate(1140 300)" filter="url(#shadow)">
    <rect x="-12" y="-78" width="24" height="16" rx="4" fill="#fb923c"/>
    <circle r="62" fill="url(#accent)"/>
    <circle r="50" fill="#0f172a"/>
    <line x1="0" y1="0" x2="0" y2="-38" stroke="#facc15" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="28" y2="12" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle r="6" fill="#facc15"/>
  </g>

  <!-- Copy -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="72" y="150" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1">IRB-in-<tspan fill="url(#accent)">Hurry</tspan></text>
    <text x="74" y="204" font-size="28" font-weight="600" fill="#e2e8f0">43 IRB forms. Plain text in. One command.</text>
    <text x="74" y="244" font-size="22" fill="#94a3b8">Ethics in the design — not in copy-pasting IRB numbers.</text>
    <g transform="translate(74 290)" font-size="18" font-weight="700">
      <rect width="148" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#facc15" stroke-opacity="0.6"/>
      <text x="74" y="26" text-anchor="middle" fill="#facc15">$ make all</text>
      <rect x="164" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="239" y="26" text-anchor="middle" fill="#e2e8f0">DOCX + PDF</text>
      <rect x="330" width="168" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="414" y="26" text-anchor="middle" fill="#e2e8f0">KFSYSCC IRB</text>
    </g>
  </g>
</svg>
