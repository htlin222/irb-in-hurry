# Institution profile — everything about KFSYSCC that is NOT study data.
# Copy institutions/_template/ to onboard another IRB; see docs/METHODOLOGY.md.
id: kfsyscc
name: 和信治癌中心醫院
name_en: Koo Foundation Sun Yat-Sen Cancer Center
committee: 人體試驗委員會
irb_no_label: KFSYSCC-IRB編號
ehr_name: 和信治癌中心醫院電子病歷系統   # data source wording for chart reviews

# Python module exposing FORM_REGISTRY + PHASE_FORMS (form ids → generators, routing)
forms_module: institutions.kfsyscc.forms

submission:
  email: irb@kfsyscc.org
  paper: 1 original + 1 copy to IRB office (B1 administrative building)

# Official blank forms: source of truth for layout, margins and wording
templates:
  # Pages that link to the blank forms; {n} expands over index_range
  index_url: https://www.kfsyscc.org/human/common_files/{n}
  index_range: [1, 11]
  link_host: google_drive     # google_drive | direct
  form_id_pattern: 'SF\s*0*(\d{1,3})'
  form_id_format: 'SF{:03d}'
  named_forms:                # official forms without a form number
    中文計畫摘要: PROPOSAL
  max_pages:                  # forms allowed to grow past their blank
    PROPOSAL: 2

# Page setup copied from the blanks' <w:sectPr> (twips; 567 twips = 1 cm)
page:
  width: 11906                # A4
  height: 16838
  margins: {left: 1134, right: 1134, top: 1418, bottom: 1418}
  header_distance: 851
  footer_distance: 992
  per_form_margins:           # (left, right, top, bottom) where a blank differs
    PROPOSAL: [1134, 1134, 1134, 1134]
    SF002: [1134, 1134, 1418, 1134]
    SF023: [1134, 1134, 1418, 1134]
    SF031: [1134, 1134, 1418, 1134]
    SF032: [1134, 1134, 1418, 567]
    SF047: [1134, 1134, 1418, 1134]
    SF062: [851, 851, 776, 800]
    SF063: [680, 737, 851, 1134]
    SF066: [1134, 1134, 1418, 851]
    SF067: [1134, 1134, 907, 284]
    SF068: [1134, 1134, 907, 1048]
    SF075: [680, 737, 851, 1134]
    SF079: [1134, 1134, 1418, 1134]
    SF080: [1134, 1134, 1418, 1134]
    SF082: [1134, 1134, 1418, 851]
    SF083: [1134, 1134, 1134, 1418]
    SF084: [1134, 1134, 1418, 851]
    SF085: [1134, 1134, 1134, 1418]
    SF090: [680, 737, 851, 1134]
    SF091: [851, 851, 851, 1134]
    SF092: [851, 851, 851, 1134]
    SF094: [1134, 1134, 1134, 1134]

font:
  name: 標楷體
  aliases: [DFKai-SB, BiauKai]   # Windows / macOS names of the same face
  lang: zh-TW                    # w:lang eastAsia
  encoding: cp950                # glyphs the font is guaranteed to have (Big5)
