name: Release

# Push a tag like v2.0.0 (matching `version` in pyproject.toml) to build the
# sdist + wheel and attach them to a GitHub Release. Publishing to PyPI is
# opt-in: set the repository variable PUBLISH_PYPI=true and add this workflow
# as a trusted publisher for the `irb-in-hurry` project on pypi.org
# (environment: pypi).

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Tag must match pyproject version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
      # A release created with GITHUB_TOKEN does not trigger `release: published`
      # workflows, so attach the architecture diagram here. The job has no
      # checkout, so fetch the two SVGs at the tagged commit via the API.
      - name: Attach architecture diagram
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          for f in architecture.svg architecture-dark.svg; do
            gh api "repos/$GITHUB_REPOSITORY/contents/docs/$f?ref=$GITHUB_SHA" \
              -H "Accept: application/vnd.github.raw" > "assets/$f" || { rm -f "assets/$f"; continue; }
          done
          ls assets/*.svg >/dev/null 2>&1 || { echo "::notice::No architecture diagram at this tag"; exit 0; }
          gh release upload "$GITHUB_REF_NAME" assets/*.svg --repo "$GITHUB_REPOSITORY" --clobber

  pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
