[project]
name = "irb-in-hurry"
version = "1.0.0"
description = "Automated KFSYSCC IRB document preparation — 43 forms, 11 categories, one command"
requires-python = ">=3.10"
dependencies = [
    "python-docx",
    "pyyaml",
    "pdf2image",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["templates", "output"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# Form text is long CJK literals; wrapping them hurts readability.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]
