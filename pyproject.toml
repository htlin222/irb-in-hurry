[project]
name = "irb-in-hurry"
version = "1.0.0"
description = "Institution-agnostic IRB form pipeline: YAML → official DOCX blanks → PDF, with a layout gate. Ships the KFSYSCC form pack (43 forms)."
requires-python = ">=3.10"
dependencies = [
    "python-docx",
    "pyyaml",
    "pdf2image",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest",
]
