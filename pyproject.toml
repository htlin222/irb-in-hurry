[project]
name = "irb-in-hurry"
version = "1.1.0"
description = "Institution-agnostic IRB form pipeline: TOML → official DOCX blanks → PDF, with a layout gate. Ships the KFSYSCC form pack (43 forms)."
requires-python = ">=3.11"  # tomllib
dependencies = [
    "python-docx",
    "pdf2image",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["templates", "output"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# Form text is long CJK literals; wrapping them hurts readability.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]
